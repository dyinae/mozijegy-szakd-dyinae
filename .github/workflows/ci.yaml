name: CI - Build and push images to ACR

# Mikor fusson: a main branchre valo push eseten,
# de csak ha a backend vagy frontend kodja valtozott.
# A k8s/ manifestek valtozasa NEM inditja (elkeruli az onmagat trigerelo ciklust).
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yaml'
  workflow_dispatch:

# A beepitett GITHUB_TOKEN irasi joga kell a manifest visszacommitolasahoz
permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. A repo kodjanak letoltese
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Bejelentkezes az Azure Container Registry-be
      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 3. Backend image build + push (commit SHA es latest cimke)
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/mozi-backend:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/mozi-backend:latest

      # 4. Frontend image build + push (commit SHA es latest cimke)
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/mozi-frontend:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/mozi-frontend:latest

      # 5. A manifestekben az image-tag frissitese a friss commit SHA-ra,
      #    majd visszacommitolas a repoba. Ezt fogja az ArgoCD eszlelni.
      - name: Update manifest image tags
        run: |
          SHA=${{ github.sha }}
          REG=${{ secrets.ACR_LOGIN_SERVER }}

          sed -i "s|image: ${REG}/mozi-backend:.*|image: ${REG}/mozi-backend:${SHA}|" k8s/backend-deployment.yaml
          sed -i "s|image: ${REG}/mozi-frontend:.*|image: ${REG}/mozi-frontend:${SHA}|" k8s/frontend-deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "Nincs valtozas a manifestekben."
          else
            git add k8s/backend-deployment.yaml k8s/frontend-deployment.yaml
            git commit -m "CI: image tag frissitese ${SHA} [skip ci]"
            git push
          fi