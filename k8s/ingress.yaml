apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mozi-ingress
  annotations:
    # a cert-manager ezt látva automatikusan kér Let's Encrypt tanúsítványt
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - novakmjegy.hu
        - www.novakmjegy.hu
      secretName: mozi-tls   # ide menti a cert-manager a tanúsítványt
  rules:
    - host: novakmjegy.hu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: www.novakmjegy.hu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
