server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip tömörítés a statikus fájlokra (gyorsabb betöltés)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # ----------------------------------------------------------
    # API hívások továbbítása a backend konténer felé.
    # A "backend" név a docker-compose / Kubernetes service neve,
    # amit a belső DNS old fel a megfelelő konténerre.
    # ----------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------
    # Angular SPA routing: ha a fájl nem létezik fizikailag,
    # az index.html-t adjuk vissza (különben az oldalfrissítés
    # mély útvonalon - pl. /admin - 404-et dobna).
    # ----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
